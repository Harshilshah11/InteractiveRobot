<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arnobot Assistant</title>
<!-- blank tab icon: an empty data URI stops the browser falling back to /favicon.ico -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<!-- Full-bleed: the assistant owns the whole screen, so the nav bar spans the
     window and everything below it fills the remaining height. -->
<header class="nav">
  <!-- Two files rather than a CSS recolour: the mark is two-tone, and only
       the brand's own white version keeps that legible on black. -->
  <picture class="brand">
    <source srcset="/static/assets/arnobot-logo-white.png" media="(prefers-color-scheme: dark)">
    <img src="/static/assets/arnobot-logo-color.png" alt="Arnobot" width="1374" height="320">
  </picture>

  <div class="nav-title">
    <h1>Assistant</h1>
    <p>Robotics Redefined</p>
  </div>

  <div class="nav-actions">
    <!-- reads /api/health: says nothing until it has actually connected, so
         "Connecting" is the honest initial state -->
    <div class="health" id="health" data-ok="pending">
      <span class="dot" aria-hidden="true"></span>
      <span id="healthText">Connecting…</span>
    </div>

    <label class="switch" title="Speak answers aloud">
      <span class="switch-label">Voice</span>
      <input type="checkbox" id="speak" role="switch" checked>
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    </label>

    <button type="button" class="icon-btn" id="fullscreen" aria-label="Enter full screen" title="Full screen (F)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="ic-expand">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="ic-collapse">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
      </svg>
    </button>
  </div>
</header>

<div class="layout">
  <!-- Questions stay in one place all session, so the list is somewhere you
       look rather than something that appears. Filled by JS — see STARTERS. -->
  <aside class="rail" aria-label="Suggested questions">
    <section class="group">
      <h2 class="group-label" id="chipsLabel">Ask me</h2>
      <div class="list chips" id="chips"></div>
    </section>

    <!-- Fixed second group: the dynamic list above changes with every answer,
         so the standing topics need somewhere that does not move. -->
    <section class="group">
      <h2 class="group-label">More topics</h2>
      <div class="list" id="topics">
        <button type="button" class="chip">Where are you located?</button>
        <button type="button" class="chip">Where have your robots been deployed?</button>
        <button type="button" class="chip">Have you won any awards?</button>
        <button type="button" class="chip">How do I place an order?</button>
        <button type="button" class="chip">Are you hiring?</button>
      </div>
    </section>
  </aside>

  <main>
    <!-- The robot and what it says are one centred block; the product strip and
         composer stay pinned below whatever height that block ends up. -->
    <div class="centre">

      <!-- data-state drives every animation:
           idle | listening | thinking | speaking | clarifying | refusing -->
      <div class="stage" id="stage" data-state="idle">
        <div class="halo" aria-hidden="true"></div>
        <svg class="robot" viewBox="0 0 240 280" aria-hidden="true">
          <defs>
            <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#ffffff"/>
              <stop offset="55%"  stop-color="#eef3fb"/>
              <stop offset="100%" stop-color="#c2d0e6"/>
            </linearGradient>
            <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#8b6cf5"/>
              <stop offset="100%" stop-color="#5b62e8"/>
            </linearGradient>
            <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#ff9f6b"/>
              <stop offset="100%" stop-color="#ff6b6b"/>
            </linearGradient>
            <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#4fe0d0"/>
              <stop offset="100%" stop-color="#22b3a6"/>
            </linearGradient>
          </defs>

          <!-- expanding rings, visible only while listening -->
          <g class="rings">
            <circle cx="120" cy="96" r="78"/>
            <circle cx="120" cy="96" r="78"/>
            <circle cx="120" cy="96" r="78"/>
          </g>

          <ellipse class="shadow" cx="120" cy="258" rx="56" ry="8"/>

          <g class="bob">
            <!-- antenna -->
            <line class="stem" x1="120" y1="46" x2="120" y2="26"/>
            <circle class="bulb" cx="120" cy="18" r="8"/>

            <!-- arms sit behind the torso -->
            <rect class="arm l" x="41"  y="162" width="18" height="54" rx="9"/>
            <rect class="arm r" x="181" y="162" width="18" height="54" rx="9"/>

            <!-- feet: drawn before the torso so it overlaps their top edge -->
            <rect class="foot" x="74"  y="232" width="32" height="16" rx="8"/>
            <rect class="foot" x="134" y="232" width="32" height="16" rx="8"/>

            <!-- torso -->
            <rect class="body" x="64" y="150" width="112" height="88" rx="28"/>
            <rect class="chest" x="87" y="166" width="66" height="48" rx="17"/>
            <circle class="core" cx="120" cy="190" r="13"/>
            <rect class="belt" x="74" y="222" width="92" height="7" rx="3.5"/>

            <!-- ear pods behind the head -->
            <ellipse class="pod l" cx="47"  cy="96" rx="11" ry="19"/>
            <ellipse class="pod r" cx="193" cy="96" rx="11" ry="19"/>

            <!-- head -->
            <g class="head">
              <rect class="shell" x="52" y="44" width="136" height="102" rx="30"/>
              <rect class="crest" x="70" y="51" width="100" height="8" rx="4"/>
              <rect class="visor" x="66" y="64" width="108" height="66" rx="24"/>

              <g class="eyes">
                <rect class="eye" x="90"  y="82" width="15" height="24" rx="7.5"/>
                <rect class="eye" x="135" y="82" width="15" height="24" rx="7.5"/>
              </g>

              <!-- inner ends sit higher than outer: reads as apologetic, not cross -->
              <g class="brows">
                <line x1="86" y1="78" x2="109" y2="72"/>
                <line x1="154" y1="78" x2="131" y2="72"/>
              </g>

              <g class="mouth">
                <rect x="101.5" y="114" width="5" height="8" rx="2.5"/>
                <rect x="109.5" y="114" width="5" height="8" rx="2.5"/>
                <rect x="117.5" y="114" width="5" height="8" rx="2.5"/>
                <rect x="125.5" y="114" width="5" height="8" rx="2.5"/>
                <rect x="133.5" y="114" width="5" height="8" rx="2.5"/>
              </g>
            </g>
          </g>
        </svg>

        <p class="caption" id="caption"></p>
      </div>

      <section class="speech" id="speech" aria-live="polite">
        <p class="heard" id="heard"></p>
        <p class="answer greeting" id="answer">How may I help you?</p>
      </section>

    </div>

    <!-- The four platforms, served from /api/products so the range is defined
         once. Always present: it is the fastest route to what most people
         opened this to ask about. -->
    <nav class="products" id="products" aria-label="Products"></nav>

    <form id="form" class="composer" autocomplete="off">
      <button type="button" id="mic" class="mic" aria-label="Speak">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
        </svg>
      </button>
      <div class="field">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" class="field-icon">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
        </svg>
        <input id="q" placeholder="Ask about Arnobot, our robots or careers" aria-label="Question" enterkeyhint="send">
        <button type="submit" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 19V5M6 11l6-6 6 6"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- only appears when something is actually wrong -->
    <p id="status" class="status" role="status"></p>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
