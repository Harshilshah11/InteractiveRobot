<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Arnobot's interactive robot assistant — ask about the company, its robots and careers.">
<title>Arnobot Interactive Robot</title>
<link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<!-- Applied before first paint, so a saved theme never flashes the other one. -->
<script>
  try {
    const t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* storage blocked: follow the system */ }
</script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<!-- Full-bleed: the assistant owns the whole screen, so the nav bar spans the
     window and everything below it fills the remaining height. -->
<header class="nav">
  <!-- Two files rather than a CSS recolour: the mark is two-tone, and only
       the brand's own white version keeps that legible on black. CSS shows
       the one that matches the active theme, chosen or system. -->
  <a class="brand" href="/" aria-label="Arnobot — start over">
    <img class="logo-light" src="/static/assets/arnobot-logo-color.png" alt="Arnobot" width="1374" height="320">
    <img class="logo-dark" src="/static/assets/arnobot-logo-white.png" alt="" aria-hidden="true" width="1405" height="320">
  </a>

  <span class="nav-divider" aria-hidden="true"></span>

  <!-- the title, and underneath it what the robot is doing right now -->
  <div class="nav-title">
    <h1>Interactive Robot</h1>
    <p class="nav-state" aria-live="polite"><span class="state-dot" aria-hidden="true"></span><span id="navState">Ready</span></p>
  </div>

  <!-- kiosk clock: time and date, updated every second -->
  <div class="nav-clock" aria-hidden="true">
    <span id="clockTime">--:--</span>
    <span id="clockDate"></span>
  </div>

  <div class="nav-actions">
    <!-- reads /api/health: says nothing until it has actually connected, so
         "Connecting" is the honest initial state -->
    <div class="health" id="health" data-ok="pending">
      <span class="dot" aria-hidden="true"></span>
      <span id="healthText">Connecting…</span>
    </div>

    <!-- iOS segmented control: follow the system, or pin light or dark -->
    <div class="segmented" id="theme" role="radiogroup" aria-label="Appearance">
      <button type="button" role="radio" data-theme-choice="system" aria-checked="true" title="Match system">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Auto</span>
      </button>
      <button type="button" role="radio" data-theme-choice="light" aria-checked="false" title="Light">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Light</span>
      </button>
      <button type="button" role="radio" data-theme-choice="dark" aria-checked="false" title="Dark">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>Dark</span>
      </button>
    </div>

    <label class="switch" title="Speak answers aloud">
      <span class="switch-label">Voice</span>
      <input type="checkbox" id="speak" role="switch" checked>
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    </label>

    <button type="button" class="icon-btn" id="fullscreen" aria-label="Enter full screen" title="Full screen (F)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="ic-expand">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="ic-collapse">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
      </svg>
    </button>
  </div>
</header>

<div class="layout">
  <!-- Questions stay in one place all session, so the list is somewhere you
       look rather than something that appears. Filled by JS — see STARTERS. -->
  <aside class="rail" aria-label="Suggested questions">
    <section class="group">
      <h2 class="group-label">
        <span class="gl-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span>
        <span id="chipsLabel">Ask me</span>
      </h2>
      <div class="list chips" id="chips"></div>
    </section>

    <!-- Fixed second group: the dynamic list above changes with every answer,
         so the standing topics need somewhere that does not move. -->
    <section class="group">
      <h2 class="group-label">
        <span class="gl-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>
        <span>More topics</span>
      </h2>
      <div class="list" id="topics">
        <button type="button" class="chip">Where are you located?</button>
        <button type="button" class="chip">Where have your robots been deployed?</button>
        <button type="button" class="chip">Have you won any awards?</button>
        <button type="button" class="chip">How do I place an order?</button>
        <button type="button" class="chip">Are you hiring?</button>
      </div>
    </section>

    <!-- A person to reach, always visible. Filled from /api/health so it uses
         the same settings as the robot's spoken referral. -->
    <section class="contact-card" id="contact" hidden>
      <p class="contact-title">Talk to the Arnobot team</p>
      <a class="contact-row" id="contactPhone">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        <span></span>
      </a>
      <a class="contact-row" id="contactEmail">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        <span></span>
      </a>
      <a class="contact-row" id="contactWeb" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span></span>
      </a>
    </section>
  </aside>

  <main>
    <!-- The robot and what it says are one centred block; the product strip and
         composer stay pinned below whatever height that block ends up. -->
    <div class="centre">

      <!-- data-state drives every animation:
           idle | listening | thinking | speaking | clarifying | refusing -->
      <div class="stage" id="stage" data-state="idle">
        <div class="halo" aria-hidden="true"></div>
        <svg class="robot" viewBox="0 0 260 290" aria-hidden="true">
          <defs>
            <!-- pearl shell: white to cool silver, lit from above -->
            <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#ffffff"/>
              <stop offset="45%"  stop-color="#eef2f8"/>
              <stop offset="100%" stop-color="#b8c2d3"/>
            </linearGradient>
            <linearGradient id="shellSide" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#000" stop-opacity=".14"/>
              <stop offset="22%"  stop-color="#000" stop-opacity="0"/>
              <stop offset="78%"  stop-color="#000" stop-opacity="0"/>
              <stop offset="100%" stop-color="#000" stop-opacity=".16"/>
            </linearGradient>
            <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#1a2140"/>
              <stop offset="100%" stop-color="#060912"/>
            </linearGradient>
            <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#8d97ab"/>
              <stop offset="100%" stop-color="#4c5468"/>
            </linearGradient>
            <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
              <stop offset="50%"  stop-color="#fff" stop-opacity=".22"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="pad" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="var(--glow)" stop-opacity=".55"/>
              <stop offset="100%" stop-color="var(--glow)" stop-opacity="0"/>
            </radialGradient>
            <clipPath id="visorClip">
              <rect x="74" y="64" width="112" height="70" rx="35"/>
            </clipPath>
          </defs>

          <!-- hover platform: soft light pool with rings rippling outwards -->
          <g class="platform">
            <ellipse class="pad" cx="130" cy="270" rx="86" ry="13"/>
            <ellipse class="ripple" cx="130" cy="270" rx="60" ry="9"/>
            <ellipse class="ripple" cx="130" cy="270" rx="60" ry="9"/>
            <ellipse class="pad-rim" cx="130" cy="270" rx="58" ry="8.5"/>
          </g>

          <!-- ambient motes drifting up past the unit -->
          <g class="motes">
            <circle cx="62"  cy="250" r="1.6"/>
            <circle cx="198" cy="244" r="1.2"/>
            <circle cx="84"  cy="262" r="1"/>
            <circle cx="176" cy="258" r="1.5"/>
            <circle cx="40"  cy="200" r="1.1"/>
            <circle cx="222" cy="206" r="1.3"/>
          </g>

          <!-- sonar rings, visible only while listening -->
          <g class="rings">
            <circle cx="130" cy="99" r="80"/>
            <circle cx="130" cy="99" r="80"/>
            <circle cx="130" cy="99" r="80"/>
          </g>

          <g class="bob">
            <!-- orbit behind the head (back half is drawn under the shell) -->
            <g class="orbit" transform="rotate(-9 130 104)">
              <ellipse class="orbit-track" cx="130" cy="104" rx="122" ry="30"/>
              <ellipse class="orbit-comet" cx="130" cy="104" rx="122" ry="30" pathLength="100"/>
            </g>

            <!-- shoulders and chest: one smooth bust, no limbs -->
            <path class="bust" d="M52 246 C54 206 86 184 130 184 C174 184 206 206 208 246 Q208 254 200 254 H60 Q52 254 52 246 Z"/>
            <path class="bust-shade" d="M52 246 C54 206 86 184 130 184 C174 184 206 206 208 246 Q208 254 200 254 H60 Q52 254 52 246 Z"/>
            <path class="seam" d="M88 200 C100 222 160 222 172 200"/>
            <rect class="core" x="108" y="214" width="44" height="4.5" rx="2.25"/>
            <rect class="neck" x="114" y="156" width="32" height="32" rx="10"/>

            <g class="head">
              <!-- side sensor modules -->
              <rect class="module" x="44"  y="76" width="14" height="46" rx="7"/>
              <rect class="module" x="202" y="76" width="14" height="46" rx="7"/>
              <rect class="module-light" x="48.5"  y="86" width="5" height="26" rx="2.5"/>
              <rect class="module-light" x="206.5" y="86" width="5" height="26" rx="2.5"/>

              <rect class="shell" x="54" y="36" width="152" height="128" rx="56"/>
              <rect class="shell-shade" x="54" y="36" width="152" height="128" rx="56"/>
              <rect class="shell-rim" x="55.5" y="37.5" width="149" height="125" rx="54.5"/>
              <!-- top sensor -->
              <circle class="sensor" cx="130" cy="50" r="3"/>

              <rect class="visor" x="74" y="64" width="112" height="70" rx="35"/>
              <g clip-path="url(#visorClip)">
                <rect class="scan" x="74" y="64" width="112" height="3"/>
                <rect class="sheen" x="40" y="60" width="44" height="80" transform="skewX(-20)"/>
              </g>

              <g class="eyes">
                <rect class="eye" x="102" y="84" width="14" height="22" rx="7"/>
                <rect class="eye" x="144" y="84" width="14" height="22" rx="7"/>
              </g>

              <!-- inner ends sit higher than outer: reads as apologetic, not cross -->
              <g class="brows">
                <line x1="98"  y1="79" x2="118" y2="74"/>
                <line x1="162" y1="79" x2="142" y2="74"/>
              </g>

              <!-- voice line: seven bars that become an equaliser when speaking -->
              <g class="mouth">
                <rect x="111" y="117" width="3" height="4" rx="1.5"/>
                <rect x="117" y="117" width="3" height="4" rx="1.5"/>
                <rect x="123" y="117" width="3" height="4" rx="1.5"/>
                <rect x="129" y="117" width="3" height="4" rx="1.5"/>
                <rect x="135" y="117" width="3" height="4" rx="1.5"/>
                <rect x="141" y="117" width="3" height="4" rx="1.5"/>
                <rect x="147" y="117" width="3" height="4" rx="1.5"/>
              </g>
            </g>

            <!-- front half of the orbit, drawn over the head -->
            <g class="orbit front" transform="rotate(-9 130 104)">
              <path class="orbit-track" d="M8 104 A122 30 0 0 0 252 104"/>
            </g>

            <!-- thinking spinner around the head -->
            <circle class="spinner" cx="130" cy="100" r="92" pathLength="100"/>
          </g>
        </svg>

        <p class="caption" id="caption"></p>
      </div>

      <section class="speech" id="speech" aria-live="polite">
        <p class="heard" id="heard"></p>
        <p class="answer greeting" id="answer">How may I help you?</p>
        <p class="hint" id="hint">Tap the microphone and ask out loud, type below, or pick a question.</p>
      </section>

    </div>

    <!-- The four platforms, served from /api/products so the range is defined
         once. Always present: it is the fastest route to what most people
         opened this to ask about. -->
    <nav class="products" id="products" aria-label="Products"></nav>

    <form id="form" class="composer" autocomplete="off">
      <button type="button" id="mic" class="mic" aria-label="Speak">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
        </svg>
      </button>
      <div class="field">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" class="field-icon">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
        </svg>
        <input id="q" placeholder="Ask about Arnobot, our robots or careers" aria-label="Question" enterkeyhint="send">
        <!-- the send arrow becomes a stop button while the robot is talking -->
        <button type="submit" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="ic-send">
            <path d="M12 19V5M6 11l6-6 6 6"/>
          </svg>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" class="ic-stop">
            <rect x="6" y="6" width="12" height="12" rx="2.5"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- only appears when something is actually wrong -->
    <p id="status" class="status" role="status"></p>
  </main>
</div>
<!-- Product showcase: opens from a product card. Text comes verbatim from
     /api/products/<key> (data/company.md), so the sheet and the robot's
     spoken answer can never disagree. -->
<div class="showcase" id="showcase" hidden>
  <div class="sc-backdrop" data-close></div>
  <article class="sc-sheet" role="dialog" aria-modal="true" aria-labelledby="scName">
    <header class="sc-head">
      <div class="sc-titles">
        <p class="sc-kicker" id="scKind"></p>
        <h2 id="scName"></h2>
      </div>
      <div class="sc-voice" id="scVoice" aria-live="polite">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span>Arnobot is speaking</span>
        <button type="button" class="sc-stop" id="scStop">Stop</button>
      </div>
      <button type="button" class="sc-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div class="sc-body">
      <section class="sc-stage" aria-label="Product view">
        <div class="sc-view" id="scView">
          <div class="sc-glow" aria-hidden="true"></div>
          <img class="sc-spin" id="scSpin" alt="" draggable="false">
          <img class="sc-photo" id="scPhoto" alt="" draggable="false">
          <video class="sc-video" id="scVideo" muted playsinline preload="none"></video>
          <div class="sc-floor" aria-hidden="true"></div>
        </div>
        <p class="sc-hint" id="scHint">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2M18 2v4h-4M6 22v-4h4"/></svg>
          <span>Drag to rotate 360°</span>
        </p>
        <div class="sc-thumbs" id="scThumbs" role="list"></div>
      </section>

      <section class="sc-info">
        <p class="sc-lead" id="scLead"></p>
        <div class="segmented sc-tabs" id="scTabs" role="tablist" aria-label="Details">
          <button type="button" role="tab" data-facet="overview" aria-selected="true">Overview</button>
          <button type="button" role="tab" data-facet="specs" aria-selected="false">Specifications</button>
          <button type="button" role="tab" data-facet="features" aria-selected="false">Features</button>
          <button type="button" role="tab" data-facet="attachments" aria-selected="false" hidden>Attachments</button>
          <button type="button" role="tab" data-facet="uses" aria-selected="false">Applications</button>
          <button type="button" role="tab" data-facet="industries" aria-selected="false">Industries</button>
        </div>
        <ul class="sc-panel" id="scPanel" role="tabpanel"></ul>
        <div class="sc-actions">
          <button type="button" class="btn btn-primary" id="scBrief">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            Hear the full brief
          </button>
          <button type="button" class="btn btn-secondary" id="scDemo">Request a demo</button>
        </div>
      </section>
    </div>
  </article>
</div>
<script src="/static/app.js"></script>
</body>
</html>
