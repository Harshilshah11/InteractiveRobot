<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#375e9d"/>
      <stop offset="1" stop-color="#230c77"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd9ec"/>
    </linearGradient>
  </defs>
  <!-- app-icon tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- antenna -->
  <rect x="30.5" y="8" width="3" height="9" rx="1.5" fill="#cfd9ec"/>
  <circle cx="32" cy="8.5" r="4" fill="#35c8ff"/>
  <!-- ear pods -->
  <rect x="6" y="27" width="7" height="14" rx="3.5" fill="#2fd0c0"/>
  <rect x="51" y="27" width="7" height="14" rx="3.5" fill="#2fd0c0"/>
  <!-- head -->
  <rect x="10" y="16" width="44" height="38" rx="12" fill="url(#shell)"/>
  <rect x="17" y="19" width="30" height="3" rx="1.5" fill="#ffcf5c"/>
  <!-- visor -->
  <rect x="15" y="25" width="34" height="23" rx="8.5" fill="#101728"/>
  <!-- eyes -->
  <rect x="22" y="30" width="6" height="10" rx="3" fill="#35c8ff"/>
  <rect x="36" y="30" width="6" height="10" rx="3" fill="#35c8ff"/>
  <!-- smile -->
  <rect x="27" y="43" width="10" height="2.4" rx="1.2" fill="#35c8ff" opacity=".85"/>
</svg>
